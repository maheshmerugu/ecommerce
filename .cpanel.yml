---
deployment:
  tasks:
    # Deployment path (update 'username' to your actual cPanel username)
    - export DEPLOYPATH=/home/username/public_html

    # Copy all files to deployment path
    - /bin/cp -r * $DEPLOYPATH

    # Go into deployment directory
    - cd $DEPLOYPATH

    # Install dependencies (make sure composer path is correct on your server)
    - /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader

    # Laravel specific optimizations
    - /usr/local/bin/php artisan config:clear
    - /usr/local/bin/php artisan config:cache
    - /usr/local/bin/php artisan route:cache
    - /usr/local/bin/php artisan view:cache

    # Run migrations (optional — enable if you want auto migrations on deploy)
    - /usr/local/bin/php artisan migrate --force
