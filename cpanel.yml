---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/public_html/fourwheels.co.in/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R . $DEPLOYPATH
    - export PHP=$(which php8.3 php8.2 php8.1 php8.0 php 2>/dev/null | head -1)
    - export COMPOSER=$(which composer composer2 2>/dev/null | head -1)
    - cd $DEPLOYPATH && $COMPOSER install --no-dev --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH && test -f .env || /bin/cp .env.example .env
    - cd $DEPLOYPATH && $PHP artisan key:generate --force
    - cd $DEPLOYPATH && $PHP artisan migrate --force
    - cd $DEPLOYPATH && $PHP artisan storage:link
    - cd $DEPLOYPATH && $PHP artisan config:cache
    - cd $DEPLOYPATH && $PHP artisan route:cache
    - cd $DEPLOYPATH && $PHP artisan view:cache
    - /bin/chmod -R 775 $DEPLOYPATH/storage
    - /bin/chmod -R 775 $DEPLOYPATH/bootstrap/cache
